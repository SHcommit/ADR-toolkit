[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adr-toolkit"
version = "1.0.1"
description = "Agent-native Architecture Decision Record toolkit with zero dependencies and deterministic precision"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ADR Toolkit Contributors" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
adr = "scripts.adr:main"

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.1.0",
    "mypy==1.19.1",
    "ruff==0.16.6",
]

[tool.ruff]
target-version = "py39"
extend-exclude = ["docs/decisions"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.setuptools]
packages = ["scripts", "scripts.core", "scripts.commands", "scripts.rules"]
package-dir = {"scripts" = "skills/adr-toolkit/scripts"}
